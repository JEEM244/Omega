name: OMEGA tests

on:
  push:
    branches: [main, "omega-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile standalone OMEGA
        run: python -m py_compile omega_ai.py test_omega.py netmap.py pcap_inspector.py wirelab_live.py
      - name: Run standalone test suite
        run: python -m unittest -v test_omega
